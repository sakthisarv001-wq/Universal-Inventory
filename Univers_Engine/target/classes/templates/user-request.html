<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Product</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments :: header}"></div>
<main class="container">
  <div th:if="${error}" class="msg error" th:text="${error}"></div>
  <div class="form-card">
    <div class="info-grid">
      <div>
        <img class="product-image detail-image" th:if="${product.imageData!=null}" th:src="@{/products/{id}/image(id=${product.id})}" alt="Product">
        <div class="product-image detail-image" th:if="${product.imageData==null}">No image</div>
      </div>
      <div>
        <span class="pill" th:text="${product.category}"></span><span class="pill" th:text="${product.subCategory}"></span>
        <h1 th:text="${product.productName}"></h1>
        <p th:text="${product.productCode}" class="muted"></p>
        <div class="stock-banner"><span>Currently available</span><strong th:text="${product.currentStock + ' ' + product.unitOfMeasurement}"></strong></div>
        <p th:text="${product.specificProductDetails ?: '-'}" class="muted"></p>
        <form th:action="@{/user/request/{id}(id=${product.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="field"><label>Unit</label><input type="text" name="uom" th:value="${product.unitOfMeasurement}" readonly></div>
          <div class="field" style="margin-top:14px"><label>Quantity to Get</label><input name="quantity" type="number" step="0.001" min="0.001" th:max="${product.currentStock}" required></div>
          <div class="actions">
            <button class="btn btn-primary" type="submit" th:disabled="${product.outOfStock}">Get Product</button>
            <a class="btn btn-light" th:href="@{/products}">Back</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
<div th:replace="~{fragments :: footer}"></div></body></html>
