<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Requests</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments :: header}"></div>
<main class="container">
  <div class="section-title"><div><div class="eyebrow">ACCOUNT</div><h2>My Product Requests</h2></div><a class="btn btn-primary" th:href="@{/products}">Browse Products</a></div>
  <div th:if="${param.success}" class="msg">Product quantity issued successfully and current stock was updated.</div>
  <div th:if="${#lists.isEmpty(requests)}" class="empty">No product requirements yet.</div>
  <div class="table-wrap" th:unless="${#lists.isEmpty(requests)}"><table class="table">
    <thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Current Stock</th><th>Quantity Got</th><th>UOM</th><th>Status</th><th>Date</th></tr></thead>
    <tbody><tr th:each="r:${requests}">
      <td><img class="small-img" th:if="${r.product.imageData!=null}" th:src="@{/products/{id}/image(id=${r.product.id})}"></td>
      <td><b th:text="${r.product.productName}"></b><br><small th:text="${r.product.productCode}"></small></td>
      <td th:text="${r.product.category}"></td>
      <td><b th:text="${r.product.currentStock + ' ' + r.product.unitOfMeasurement}"></b></td>
      <td th:text="${r.requiredQuantity}"></td><td th:text="${r.requestedUom}"></td>
      <td><span class="status" th:text="${r.status}"></span></td>
      <td th:text="${#temporals.format(r.requestedAt,'dd-MM-yyyy HH:mm')}"></td>
    </tr></tbody>
  </table></div>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
