<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header">
<header class="site-header">
  <div class="header-inner">
    <a class="brand" th:href="@{/}"><img th:src="@{/images/logo.jpg}" alt="Universal Engineers"></a>
    <nav class="main-nav" sec:authorize="isAuthenticated()">
      <a th:href="@{/products}">Products</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Manage</a>
      <a sec:authorize="hasRole('USER')" th:href="@{/user/requests}">My Requests</a>
    </nav>
    <div class="header-actions">
      <a sec:authorize="isAnonymous()" class="btn btn-dark" th:href="@{/login}">Login</a>
      <span sec:authorize="isAuthenticated()" class="role-badge">
        <span sec:authorize="hasRole('ADMIN')">ADMIN</span>
        <span sec:authorize="hasRole('USER')">USER</span>
      </span>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin:0">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-dark" type="submit">Logout</button>
      </form>
      <select class="language" onchange="location=this.value" aria-label="Language">
        <option value="?lang=en">English</option>
        <option value="?lang=ta">தமிழ்</option>
        <option value="?lang=hi">हिन्दी</option>
      </select>
    </div>
  </div>
</header>
<script>
window.addEventListener('pageshow', function(event) {
  if (event.persisted) window.location.reload();
});
</script>
</div>
<div th:fragment="footer" class="footer">© 2026 Universal Engineers. Product Management System.</div>
</html>
