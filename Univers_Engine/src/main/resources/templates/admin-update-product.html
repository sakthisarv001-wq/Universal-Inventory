<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Update Product</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments :: header}"></div><main class="container"><div class="section-title"><h2>Update Product</h2></div><div class="notice">Edit as many fields as you need. Click Submit Changes only once after completing all changes.</div><div class="form-card"><form th:action="@{/admin/products/edit/{id}(id=${product.id})}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div th:replace="~{product-form :: formFields}"></div><div class="actions"><button class="btn btn-primary" type="submit">Submit Changes</button><a class="btn btn-light" th:href="@{/admin/products}">Cancel</a></div></form></div></main><div th:replace="~{fragments :: footer}"></div></body></html>
